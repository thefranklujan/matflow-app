name: e2e

# Fully isolated: ephemeral Postgres service, synthetic env only, no secrets,
# no external integrations. No untrusted event text is interpolated anywhere.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: matflow
          POSTGRES_PASSWORD: matflow_ci_local_only
          POSTGRES_DB: matflow_test
        ports:
          - 5544:5432
        options: >-
          --health-cmd "pg_isready -U matflow -d matflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "1"
      E2E_DATABASE_URL: postgresql://matflow:matflow_ci_local_only@localhost:5544/matflow_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Functional E2E (desktop + mobile)
        run: npm run test:e2e:functional
      - name: Visual E2E (screenshot baselines)
        # Runs even when the functional step failed, so neither category can
        # hide the other's result.
        if: ${{ !cancelled() }}
        run: npm run test:e2e:visual
      - name: Upload Playwright artifacts (failures only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
